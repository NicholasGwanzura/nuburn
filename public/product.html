<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <!-- @meta -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <script src="/store.js" defer></script>
  <script src="/product.js" defer></script>
</head>
<body class="inner-page">
  <!-- @header -->
  <section class="page-hero page-hero--compact" aria-label="The collection">
    <img class="page-hero-img" id="product-hero-img" src="/images/hero.jpg" alt="" fetchpriority="high">
    <div class="page-hero-inner section-wrap">
      <nav class="page-hero-crumbs" aria-label="Breadcrumb"><a href="/shop#catalog">Shop</a><span aria-hidden="true">/</span><span id="crumb-category">…</span></nav>
      <p class="page-hero-title">The <em>collection.</em></p>
    </div>
  </section>
  <main id="main" class="section-wrap product-page">
    <div id="product-root" aria-live="polite"><div class="catalog-loading" aria-label="Loading product"><span></span><span></span><span></span></div></div>
  </main>
  <!-- @footer -->
</body>
</html>
